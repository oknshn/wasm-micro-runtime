CONFIG_STACK_SENTINEL=y
CONFIG_PRINTK=y
#CONFIG_LOG_BUFFER_SIZE=32768
CONFIG_CMSIS_DSP=y
CONFIG_CMSIS_DSP_SUPPORT=y
CONFIG_CMSIS_DSP_BASICMATH=y
CONFIG_CMSIS_DSP_MATRIX=y
CONFIG_CMSIS_DSP_STATISTICS=y

# Enable CMSIS-NN so Cortex-M targets (e.g. MAX32690)
# can use convolution and softmax NN kernels.
CONFIG_CMSIS_NN=y
CONFIG_CMSIS_NN_CONVOLUTION=y
CONFIG_CMSIS_NN_SOFTMAX=y

