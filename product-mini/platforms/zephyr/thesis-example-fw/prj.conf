CONFIG_STACK_SENTINEL=y
CONFIG_PRINTK=y
#CONFIG_LOG_BUFFER_SIZE=32768

# =============================================================================
# Hardware FPU (critical for float32 performance on Cortex-M4F!)
# =============================================================================
CONFIG_FPU=y

# =============================================================================
# CMSIS-DSP Configuration (ARM Cortex-M)
# =============================================================================
CONFIG_CMSIS_DSP=y
CONFIG_CMSIS_DSP_SUPPORT=y
CONFIG_CMSIS_DSP_BASICMATH=y
CONFIG_CMSIS_DSP_MATRIX=y
CONFIG_CMSIS_DSP_STATISTICS=y
CONFIG_CMSIS_DSP_FASTMATH=y

# Enable loop unrolling optimization (4x unroll for better pipelining)
CONFIG_CMSIS_DSP_LOOPUNROLL=y

# Enable CMSIS-NN so Cortex-M targets (e.g. MAX32690)
# can use convolution and softmax NN kernels.
CONFIG_CMSIS_NN=y
CONFIG_CMSIS_NN_CONVOLUTION=y
CONFIG_CMSIS_NN_SOFTMAX=y
CONFIG_CMSIS_NN_NNSUPPORT=y

